services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aqua:aqua@db:5432/aqua?schema=public
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: aqua
      POSTGRES_DB: aqua
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqua -d aqua"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  node_modules:
  pgdata:
