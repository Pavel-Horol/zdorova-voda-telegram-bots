# Prod-стек: бот + Postgres на одном сервере.
# Запуск на сервере:  docker compose -f docker-compose.prod.yml up -d --build
#
# Секреты берутся из файла .env (compose читает его автоматически — и для интерполяции
# ${...} ниже, и построчно прокидывает в контейнер приложения через env_file).
# .env в .gitignore — в репозиторий он НЕ попадает. Шаблон: .env.production.example.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aqua-bot:latest
    restart: always            # упал процесс / ребут сервера → контейнер поднимется сам
    env_file: .env             # CLIENT_BOT_TOKEN, DISPATCHER_BOT_TOKEN, DISPATCHER_CHAT_ID, SUPPORT_PHONE
    environment:
      NODE_ENV: production
      # Внутри compose-сети хост БД — имя сервиса `db`, а не localhost.
      # Эта строка ПЕРЕКРЫВАЕТ любой DATABASE_URL из .env (environment > env_file).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    # ports НЕ публикуем: long polling требует только исходящих соединений к Telegram.

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Данные живут в именованном volume, а НЕ внутри контейнера: контейнер можно
      # пересобрать/удалить — база останется. Это и есть «база отдельно от приложения».
      - pgdata:/var/lib/postgresql/data
    # Порт наружу не открываем в интернет. Слушаем только localhost сервера —
    # чтобы можно было подключиться psql/дампом по SSH-туннелю. Не нужен доступ с хоста
    # вообще — закомментируй весь блок ports.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
