name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "integration/**"

# Отменяем предыдущий прогон для той же ветки/PR, если пришёл новый пуш
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: lint · types · arch · tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Клиент Prisma генерится в generated/prisma (в .gitignore).
      # Без этого шага не пройдут ни типы, ни сборка, ни тесты.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture rules (CLAUDE.md)
        run: npm run arch:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  # CD: автовыкатка на VPS (DEPLOY.md §13). Запускается ТОЛЬКО после зелёного
  # quality-gate и ТОЛЬКО на push в master — на PR и integration/** деплоя нет.
  deploy:
    name: deploy → prod VPS
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Деплои строго по одному и НЕ отменяются на середине: прерванный
    # `docker compose up --build` хуже, чем чуть устаревший — следующий пуш
    # просто дождётся очереди и выкатит самое свежее.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Set up SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # Те же команды, что при ручной выкатке (DEPLOY.md §9), плюс:
      # reset --hard вместо pull — прод-чекаут всегда точная копия origin/master
      # (локальных правок на сервере быть не должно; .env не в git — его не тронет).
      - name: Pull & rebuild on server
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" /bin/bash << 'EOF'
            set -euo pipefail
            cd ~/zdorova-voda-telegram-bots
            git fetch origin master
            git reset --hard origin/master
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
          EOF
