name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "integration/**"

# Отменяем предыдущий прогон для той же ветки/PR, если пришёл новый пуш
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: lint · types · arch · tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Клиент Prisma генерится в generated/prisma (в .gitignore).
      # Без этого шага не пройдут ни типы, ни сборка, ни тесты.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture rules (CLAUDE.md)
        run: npm run arch:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
